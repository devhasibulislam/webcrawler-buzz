name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/webcrawler-buzz-web

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "deploy/docker-compose.yaml"
          target: "/opt/webcrawler-buzz/"
          strip_components: 1
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /opt/webcrawler-buzz
            [ -f deploy/docker-compose.yaml ] && mv -f deploy/docker-compose.yaml docker-compose.yaml || true
            rm -rf deploy 2>/dev/null || true
            docker network inspect web >/dev/null 2>&1 || docker network create web
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ needs.build.outputs.image_tag }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
      - name: Smoke test
        run: |
          for i in {1..18}; do
            sleep 10
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://webcrawler.buzz/ || echo "000")
            echo "attempt $i → $code"
            [[ "$code" =~ ^(200|301|302|307|308)$ ]] && exit 0
          done
          exit 1
