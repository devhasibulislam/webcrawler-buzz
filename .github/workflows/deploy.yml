name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RELEASE_ID: ${{ github.sha }}
  PROJECT: webcrawler-buzz

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Assemble runtime bundle
        run: |
          set -euo pipefail
          B=_deploy
          rm -rf "$B" && mkdir -p "$B"
          cp package.json package-lock.json "$B/"
          cp ecosystem.config.js "$B/"
          cp .env.production "$B/.env"
          cp -r dist "$B/dist"
          cp -r public "$B/public"
          tar -czf release.tgz -C "$B" .

      - name: SSH setup
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload + activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -p $VPS_SSH_PORT $VPS_USER@$VPS_HOST"
          SCP="scp -i ~/.ssh/deploy_key -P $VPS_SSH_PORT"
          REL=$RELEASE_ID
          $SSH "mkdir -p /opt/$PROJECT/releases/$REL"
          $SCP release.tgz $VPS_USER@$VPS_HOST:/opt/$PROJECT/releases/$REL/release.tgz
          $SSH "set -euo pipefail
                cd /opt/$PROJECT/releases/$REL
                tar -xzf release.tgz && rm release.tgz
                npm ci --omit=dev --no-audit --no-fund --ignore-scripts
                node dist/db/migrate.js
                ln -sfn /opt/$PROJECT/releases/$REL /opt/$PROJECT/current
                cd /opt/$PROJECT/current
                pm2 delete ecosystem.config.js 2>/dev/null || true
                pm2 start ecosystem.config.js --update-env
                pm2 save
                ls -1dt /opt/$PROJECT/releases/*/ | tail -n +4 | xargs -r rm -rf"

      - name: Smoke test
        run: |
          for i in {1..24}; do
            sleep 10
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://webcrawler.buzz/api/health || echo "000")
            echo "attempt $i → $code"
            [[ "$code" == "200" ]] && exit 0
          done
          echo "smoke test failed after 24 attempts"
          exit 1
