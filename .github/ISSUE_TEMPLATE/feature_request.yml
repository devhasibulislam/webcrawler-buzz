name: Feature request
description: Suggest a new capability or improvement.
title: '[feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The user pain, not the solution. What's blocking someone today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could WebCrawler.buzz help? Keep it concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you'd land on the one above.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I've read CONTRIBUTING.md and this feature fits the project scope.
