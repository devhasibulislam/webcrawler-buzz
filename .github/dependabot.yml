version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      # Batch minor/patch upgrades so we don't drown in PRs.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # Security PRs are individual so they can ship fast.
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
      include: scope
