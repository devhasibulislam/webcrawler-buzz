# webcrawler.buzz — production compose
# Runs on Contabo VPS at /opt/webcrawler-buzz/docker-compose.yaml.
#
# Public traffic hits the SHARED Traefik proxy in /opt/proxy/ (owns :80 and :443).
# Postgres + Redis run on the host (apt) and are reached via host.docker.internal.
#
# CI/CD populates IMAGE_TAG. Local runs without it default to :latest.

name: webcrawler-buzz

services:
  web:
    image: ghcr.io/devhasibulislam/webcrawler-buzz-web:${IMAGE_TAG:-latest}
    container_name: webcrawler-buzz-web
    restart: unless-stopped
    env_file:
      - /opt/webcrawler-buzz/.env
    expose:
      - "5005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - webcrawler-buzz-net
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5005/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      # ── Traefik: expose this container ────────────────────────────────
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      # ── Main app on apex + api subdomain ──────────────────────────────
      - "traefik.http.routers.webcrawler-buzz.rule=Host(`webcrawler.buzz`) || Host(`api.webcrawler.buzz`)"
      - "traefik.http.routers.webcrawler-buzz.entrypoints=websecure"
      - "traefik.http.routers.webcrawler-buzz.tls=true"
      - "traefik.http.routers.webcrawler-buzz.service=webcrawler-buzz"
      - "traefik.http.services.webcrawler-buzz.loadbalancer.server.port=5005"

      # ── www → apex redirect ───────────────────────────────────────────
      - "traefik.http.routers.webcrawler-buzz-www.rule=Host(`www.webcrawler.buzz`)"
      - "traefik.http.routers.webcrawler-buzz-www.entrypoints=websecure"
      - "traefik.http.routers.webcrawler-buzz-www.tls=true"
      - "traefik.http.routers.webcrawler-buzz-www.middlewares=webcrawler-buzz-www-redirect"
      - "traefik.http.middlewares.webcrawler-buzz-www-redirect.redirectregex.regex=^https://www\\.webcrawler\\.buzz/(.*)$$"
      - "traefik.http.middlewares.webcrawler-buzz-www-redirect.redirectregex.replacement=https://webcrawler.buzz/$${1}"
      - "traefik.http.middlewares.webcrawler-buzz-www-redirect.redirectregex.permanent=true"

networks:
  webcrawler-buzz-net:
    driver: bridge
  web:
    external: true
    name: web
