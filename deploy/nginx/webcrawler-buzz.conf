# Nginx site for webcrawler.buzz.
# Cloudflare origin cert at /etc/ssl/webcrawler/webcrawler.buzz.{crt,key}.
# Single Node process on 127.0.0.1:5005 (Express + BullMQ + cron).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name webcrawler.buzz www.webcrawler.buzz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.webcrawler.buzz;

    ssl_certificate     /etc/ssl/webcrawler/webcrawler.buzz.crt;
    ssl_certificate_key /etc/ssl/webcrawler/webcrawler.buzz.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://webcrawler.buzz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webcrawler.buzz;

    ssl_certificate     /etc/ssl/webcrawler/webcrawler.buzz.crt;
    ssl_certificate_key /etc/ssl/webcrawler/webcrawler.buzz.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
